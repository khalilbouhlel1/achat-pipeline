@'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: achat-mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: achat-mysql
  template:
    metadata:
      labels:
        app: achat-mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "root"
            - name: MYSQL_DATABASE
              value: "achat"
          ports:
            - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: achat-mysql
spec:
  selector:
    app: achat-mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: achat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: achat-app
  template:
    metadata:
      labels:
        app: achat-app
    spec:
      containers:
        - name: achat-app
          image: lotfii1/achat-app:dev-lotfi
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://achat-mysql:3306/achat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "root"
---
apiVersion: v1
kind: Service
metadata:
  name: achat-app-service
spec:
  type: LoadBalancer
  selector:
    app: achat-app
  ports:
    - port: 8089
      targetPort: 8089
'@ | Set-Content -Path k8s\deployment.yaml -Encoding UTF8