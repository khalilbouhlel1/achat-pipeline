apiVersion: apps/v1
kind: Deployment
metadata:
  name: achat-app
  labels:
    app: achat-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: achat-app
  template:
    metadata:
      labels:
        app: achat-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/SpringMVC/actuator/prometheus"
        prometheus.io/port: "8089"
    spec:
      containers:
        - name: achat-app
          image: nejimissaoui/achat-app:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8089
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/achat?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "achat123"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
