global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'achat-app'
    metrics_path: '/SpringMVC/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app-achat:8089', 'host.docker.internal:8089']
        labels:
          application: 'achat-application'
